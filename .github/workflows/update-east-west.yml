name: Update East-West product

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-east-west.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('''      <input type="tel" id="buyer-phone" class="form-input" placeholder="聯絡電話 *">\n\n      <div class="bank-box">''', '''      <input type="tel" id="buyer-phone" class="form-input" placeholder="聯絡電話 *">\n      <input type="text" id="store-name" class="form-input" placeholder="7-11 收貨門市 *">\n\n      <div class="bank-box">''')
          s = s.replace('''        <p style="margin-top: 0.4rem; border-top: 1px dashed var(--border-color); padding-top: 0.4rem; color: var(--accent); font-weight: 600;">\n          應付總金額：NT$ <span id="bank-total">0</span>\n        </p>''', '''        <p style="margin-top: 0.4rem; border-top: 1px dashed var(--border-color); padding-top: 0.4rem;">\n          運費：NT$ <span id="bank-shipping-line">0</span>\n        </p>\n        <p style="margin-top: 0.4rem; border-top: 1px dashed var(--border-color); padding-top: 0.4rem; color: var(--accent); font-weight: 600;">\n          應付總金額：NT$ <span id="bank-total">0</span>\n        </p>''')
          start = s.index("      'item1': {")
          end = s.index("      'item2': {", start)
          item = '''      'item1': {
            title: '【織造所原創系列】East-West 都會漫遊者 材料包', price: 1380, tag: '鉤織材料包',
            body: `
              <div style="display:flex; flex-direction:column; gap:12px; margin:0.5rem 0 1.2rem;"><img src="East-West - 1.jpg" alt="都會漫遊者成品" style="width:100%; height:auto; border-radius:10px; display:block;"><img src="East-West - 2.jpg" alt="利達豐QQ線" style="width:100%; height:auto; border-radius:10px; margin:0.5rem 0 1.2rem; object-fit:cover;"></div>
              <p class="product-description" style="line-height:1.8; margin:0 0 1rem;">以極簡俐落的橫向廓形為基底，透過低調的純黑皮標與傘繩細節，呈現出注重質感與細節、不張揚的「靜奢風」日常包款。</p>
              <p><strong>【材料包內容】</strong></p><ul><li>嚴選老牌 (利達豐) 台製線材 1 卷</li><li>五金扣環 1 組</li><li>傘繩（黑） 1 組</li><li>純黑皮標 1 枚</li><li>文字織圖</li><li>專屬線上邏輯輔導 30 分鐘 (加官方line預約)</li></ul>
              <div style="margin-top:1.3rem;"><p><strong>【款式亮點與特色】</strong></p><ul><li>實用大容量空間：精心規劃的完美比例，不僅放得下手機與長夾，還能順暢容納「多一點」的日常必需品—無論是一瓶水還是一把折傘，都能輕鬆收納。</li><li>特色編繩背帶設計：特別在背帶細節中注入繩結編織，透過不同材質與層次的交織，創造出極具視覺巧思的細節變化，讓簡約的包款更具設計感。</li><li>輕量硬挺 QQ 線：嚴選利達豐優質線材，質地柔軟輕盈卻極具硬挺度，長時間背負不沉重，且能常保包型扎實挺拔。</li><li>百搭經典輪廓：乾淨平整的針目結構，完美契合極簡美學。正裝俐落、休閒隨性，一包就能駕馭各種穿搭場合。</li><li>簡約極致的細節：極簡純黑皮標 + 百搭黑編繩背帶，以最克制洗鍊的方式為作品點綴，展現不張揚的職人質感。</li></ul></div>
              <div style="margin-top:1.3rem;"><p><strong>【織造所獨家教學輔導】</strong></p><p>購買即享線上針目結構與張力解答支援，不用擔心看懂織圖卻織不出完美形狀！</p></div>
              <div style="margin-top:1.3rem;"><p><strong>【包款細節】</strong></p><ul><li>線徑約 2 mm，建議鉤針號數：5 - 6 號</li><li>完成尺寸參考：寬 28 / 長 17（公分）</li><li>示範色：Q15 深卡其</li></ul></div>
            `
          },
'''
          s = s[:start] + item + s[end:]
          needle = '''      if (isPlanningOnly) {'''
          add = '''      if (key === 'item1') {
            selectsHtml += `<div style="margin-top:1.4rem; padding-top:1.2rem; border-top:1px solid var(--border-color);"><p style="font-weight:600; margin-bottom:0.6rem;">【購買項目】*</p><div style="display:flex; flex-direction:column; gap:0.55rem; line-height:1.8; font-size:0.92rem;"><label><input type="checkbox" name="east-west-option" value="材料包" data-price="1380"> 材料包 $1380</label><label><input type="checkbox" name="east-west-option" value="線材＆五金配件加購" data-price="880"> 線材 ＆ 五金配件加購 $880（不含織圖及線上課程）</label><label><input type="checkbox" name="east-west-option" value="日本廣島紅柄鉤針 5 號" data-price="280"> 日本廣島紅柄鉤針 5 號 $280</label><label><input type="checkbox" name="east-west-option" value="日本廣島紅柄鉤針 6 號" data-price="280"> 日本廣島紅柄鉤針 6 號 $280</label><label><input type="checkbox" name="east-west-option" value="成品包" data-price="2680"> 成品包 $2680</label></div></div>`;
            actionBtnHtml = `<button class="btn-primary" style="width:auto; padding:0.7rem 1.8rem;" onclick="addDetailToCart('${data.title}', 0)">加入購物車 / 購買</button>`;
          }

          if (isPlanningOnly) {'''
          s = s.replace(needle, add, 1)
          marker = '''  // -------------------------------------------------------------\n  // ▼ 不管是 class1, class2, class3 還是 item1~4，最後都要執行打開彈窗 ▼'''
          listener = '''  if (key === 'item1') {
            const updateEastWestPrice = () => {
              const options = document.querySelectorAll('input[name="east-west-option"]:checked');
              const total = Array.from(options).reduce((sum, option) => sum + Number(option.dataset.price || 0), 0);
              const priceDisplay = document.getElementById('modal-price-display');
              if (priceDisplay) priceDisplay.innerText = total.toLocaleString();
            };
            document.querySelectorAll('input[name="east-west-option"]').forEach(input => input.addEventListener('change', updateEastWestPrice));
            updateEastWestPrice();
          }

'''+marker
          s = s.replace(marker, listener, 1)
          anchor = '''  let finalPrice = typeof price === 'number' ? price : 990;\n\n'''
          addlogic = anchor + '''  if (title === '【織造所原創系列】East-West 都會漫遊者 材料包') {
            const selectedOptions = document.querySelectorAll('input[name="east-west-option"]:checked');
            if (!selectedOptions.length) { alert('請至少選擇一項購買項目'); return; }
            finalPrice = 0;
            selectedOptions.forEach(option => { detailsText.push(`${option.value} $${Number(option.dataset.price).toLocaleString()}`); finalPrice += Number(option.dataset.price); });
          }
'''
          s = s.replace(anchor, addlogic, 1)
          old = '''      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);\n      document.getElementById('bank-total').innerText = total;'''
          new = '''      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const hasEastWest = cart.some(item => item.name.includes('East-West 都會漫遊者'));
      const shippingFee = hasEastWest && subtotal < 1800 ? 60 : 0;
      document.getElementById('bank-total').innerText = subtotal + shippingFee;
      document.getElementById('bank-shipping-line').innerText = shippingFee;'''
          s = s.replace(old, new, 1)
          a = s.index('    function submitOrderToLine() {'); b = s.index('      navigator.clipboard.writeText(orderText)', a)
          fn = '''    function submitOrderToLine() {
            const name = document.getElementById('buyer-name').value.trim(); const phone = document.getElementById('buyer-phone').value.trim(); const storeName = document.getElementById('store-name').value.trim();
            if (!name || !phone || !storeName) { alert('請填寫訂購人姓名、聯絡電話及 7-11 收貨門市！'); return; }
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0); const hasEastWest = cart.some(item => item.name.includes('East-West 都會漫遊者')); const shippingFee = hasEastWest && subtotal < 1800 ? 60 : 0; const total = subtotal + shippingFee; const itemList = cart.map(item => `${item.name} x${item.qty}`).join('、');
            const orderText = `【織造所｜訂單成立通知】\n------------------------\n訂購姓名：${name}\n聯絡電話：${phone}\n7-11 收貨門市：${storeName}\n訂購項目：${itemList}\n商品小計：NT$ ${subtotal}\n運費：NT$ ${shippingFee}\n應付金額：NT$ ${total}\n------------------------\n【匯款帳號資訊】\n銀行代碼：807 (永豐銀行)\n轉帳帳號：10101800006824\n------------------------\n帳號末 5 碼：\n\n（訂單已成立！請於完成轉帳後，直接在此回覆帳號末 5 碼，我們將儘速為您對帳與安排製作，謝謝！）`;

'''
          s = s[:a] + fn + s[b:]
          s = s.replace('https://line.me/R/ti/p/@YOUR_LINE_ID', 'https://lin.ee/yyzyhp2')
          s = s.replace("        document.getElementById('buyer-phone').value = '';\n", "        document.getElementById('buyer-phone').value = '';\n        document.getElementById('store-name').value = '';\n")
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'Update East-West material kit purchase flow'
          git push
