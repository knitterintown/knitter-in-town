<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>織造所 knitter in town</title>
  <style>
    /* 日本傳統色配色系統 (NIPPON COLORS) */
    :root {
      --bg-main: #EFE6E2;       /* 網站主背景色：淺灰櫻 */
      --bg-card: #FDFBF8;       /* 卡片與彈窗底色：柔白 */
      --header-bg: #947A6D;     /* 頂部導覽列：胡桃 */
      --text-main: #6A4028;     /* 主要文字與標題：栗皮茶 */
      --text-light: #FDFBF8;    /* 深色背景上的淺色文字 */
      --secondary: #82663A;     /* 輔助與邊框裝飾：銀煤竹 */
      --accent: #AB3B3A;        /* 重點按鈕與焦點：真朱 */
      --accent-hover: #8C2E2D;  /* 按鈕懸停深朱紅 */
      --border-color: #DCD0C9;  /* 柔和劃分線 */
    }

    /* 課程標籤樣式 */
    .card-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tag {
      font-size: 0.82rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
      display: inline-block;
    }

    /* 主標籤：工藝種類 (深色) */
    .tag-main {
      background-color: #8C6D58;
      color: #ffffff;
    }

    /* 副標籤：授課形式 (淡色) */
    .tag-sub {
      background-color: #F0EAE1;
      color: #55443B;
      border: 1px solid #D9CEC2;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.8;
      letter-spacing: 0.05em;
    }

    h1, h2, h3, .logo {
      font-family: 'Noto Serif TC', serif;
      font-weight: 700;
    }

    /* 頂部導覽列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 2.5rem;
      background-color: rgba(148, 122, 109, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(106, 64, 40, 0.08);
    }

    .logo {
      font-size: 1.75rem;
      color: var(--text-light);
      letter-spacing: 0.15em;
      font-weight: 700;
    }

    nav { 
      display: flex; 
      align-items: center; 
    }

    nav a {
      margin-left: 1.8rem;
      color: var(--text-light);
      text-decoration: none;
      font-size: 0.95rem;
      transition: opacity 0.3s ease;
    }

    nav a:hover {
      opacity: 0.8;
    }

    /* 頁面主要區塊 */
    section {
      padding: 60px 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-title h2 {
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: 10px;
      position: relative;
      display: inline-block;
    }

    .section-title h2::after {
      content: '';
      display: block;
      width: 40px;
      height: 3px;
      background-color: var(--accent);
      margin: 10px auto 0;
      border-radius: 2px;
    }

    /* 課程卡片網格 (三欄排版) */
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .course-card {
      background-color: var(--bg-card);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(106, 64, 40, 0.05);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .course-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(106, 64, 40, 0.1);
    }

    .course-card h3 {
      font-size: 1.35rem;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .course-card p {
      font-size: 0.95rem;
      color: #66554B;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .course-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 20px;
    }

    .card-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-outline, .btn-primary {
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--text-main);
      color: var(--text-main);
      flex: 1;
    }

    .btn-outline:hover {
      background-color: rgba(106, 64, 40, 0.05);
    }

    .btn-primary {
      background-color: var(--accent);
      border: none;
      color: var(--text-light);
      flex: 2;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    /* 相片輪播區塊 */
    .carousel-section {
      margin-top: 40px;
    }

    .carousel-container {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-slide {
      min-width: 100%;
      box-sizing: border-box;
    }

    .carousel-slide img {
      width: 100%;
      height: 480px;
      object-fit: cover;
      display: block;
    }

    /* 輪播按鈕 */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(148, 122, 109, 0.7);
      color: white;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    .carousel-btn:hover {
      background: rgba(148, 122, 109, 0.95);
    }

    .carousel-btn.prev { left: 15px; }
    .carousel-btn.next { right: 15px; }

    /* 輪播指示點 */
    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #D9CEC2;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .dot.active {
      background-color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header>
    <div class="logo">織造所</div>
    <nav>
      <a href="#about">關於織造所</a>
      <a href="#courses">課程</a>
      <a href="#products">作品 / 材料包</a>
    </nav>
  </header>

  <!-- 熱門手作課程區塊 -->
  <section class="courses" id="courses">
    <div class="section-title">
      <h2>熱門手作課程</h2>
      <p style="text-align:center; color: #82663A; margin-top: 5px;">
        從邏輯分析出發，提供系統化線上影片與溫馨實體教學
      </p>
    </div>

    <div class="course-grid">
      <!-- 課程 1：鉤織 + 實體課程 -->
      <div class="course-card">
        <div>
          <div class="card-tags">
            <span class="tag tag-main">鉤織課程</span>
            <span class="tag tag-sub">實體課程</span>
          </div>
          <h3>基礎鉤織團體課程</h3>
          <p>獨創邏輯教學法，引導分析針法結構與手勁校正，新手也能理解背後原理。</p>
        </div>
        <div>
          <div class="course-price">NT$ 1,400</div>
          <div class="card-buttons">
            <button class="btn-outline">詳細介紹</button>
            <button class="btn-primary">課程報名</button>
          </div>
        </div>
      </div>

      <!-- 課程 2：繩編 + 實體課程 -->
      <div class="course-card">
        <div>
          <div class="card-tags">
            <span class="tag tag-main">繩編課程</span>
            <span class="tag tag-sub">實體課程</span>
          </div>
          <h3>質感繩編手機掛繩</h3>
          <p>融合耐重結藝技巧與質感配色，親手打造專屬的繩編手機掛繩。</p>
        </div>
        <div>
          <div class="course-price">NT$ 980</div>
          <div class="card-buttons">
            <button class="btn-outline">詳細介紹</button>
            <button class="btn-primary">課程報名</button>
          </div>
        </div>
      </div>

      <!-- 課程 3：鉤織 + 線上課程 -->
      <div class="course-card">
        <div>
          <div class="card-tags">
            <span class="tag tag-main">鉤織課程</span>
            <span class="tag tag-sub">線上課程</span>
          </div>
          <h3>鉤織邏輯起步走：蝴蝶結吊飾</h3>
          <p>課程分為 7 個單元，影片總長約一小時，可無限次觀看。獨創邏輯教學法，新手也能理解背後原理。</p>
        </div>
        <div>
          <div class="course-price">NT$ 800</div>
          <div class="card-buttons">
            <button class="btn-outline">詳細介紹</button>
            <button class="btn-primary">課程報名</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 實體活動輪播照片區塊 -->
  <section class="carousel-section">
    <div class="section-title">
      <h2>實體課程紀錄</h2>
    </div>
    
    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack">
        <!-- 照片請換成你的實際圖片路徑 (例如: images/photo1.jpg) -->
        <div class="carousel-slide">
          <img src="https://picsum.photos/900/480?random=1" alt="實體課程照片 1">
        </div>
        <div class="carousel-slide">
          <img src="https://picsum.photos/900/480?random=2" alt="實體課程照片 2">
        </div>
        <div class="carousel-slide">
          <img src="https://picsum.photos/900/480?random=3" alt="實體課程照片 3">
        </div>
      </div>

      <!-- 切換按鈕 -->
      <button class="carousel-btn prev" id="prevBtn">&#10094;</button>
      <button class="carousel-btn next" id="nextBtn">&#10095;</button>
    </div>

    <!-- 輪播圓點指示器 -->
    <div class="carousel-dots">
      <span class="dot active" data-index="0"></span>
      <span class="dot" data-index="1"></span>
      <span class="dot" data-index="2"></span>
    </div>
  </section>

  <!-- 輪播 JavaScript 控制腳本 -->
  <script>
    const track = document.getElementById('carouselTrack');
    const slides = Array.from(track.children);
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');
    const dots = document.querySelectorAll('.dot');

    let currentIndex = 0;

    function updateCarousel(index) {
      track.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach(dot => dot.classList.remove('active'));
      dots[index].classList.add('active');
      currentIndex = index;
    }

    nextBtn.addEventListener('click', () => {
      let nextIndex = (currentIndex + 1) % slides.length;
      updateCarousel(nextIndex);
    });

    prevBtn.addEventListener('click', () => {
      let prevIndex = (currentIndex - 1 + slides.length) % slides.length;
      updateCarousel(prevIndex);
    });

    dots.forEach(dot => {
      dot.addEventListener('click', (e) => {
        const targetIndex = parseInt(e.target.dataset.index);
        updateCarousel(targetIndex);
      });
    });

    // 自動輪播（每 5 秒切換一次）
    setInterval(() => {
      let nextIndex = (currentIndex + 1) % slides.length;
      updateCarousel(nextIndex);
    }, 5000);
  </script>
</body>
</html>
