<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>織造所 knitter in town</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAF8F5;
      --card-bg: #FFFFFF;
      --text-main: #3D2E24;
      --accent: #8C6239;
      --accent-hover: #704E2D;
      --border-color: #E6DFD5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-family: 'Noto Serif TC', serif;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .price {
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .add-btn {
      background-color: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-btn:hover {
      background-color: var(--accent);
      color: white;
    }

    /* 購物車區塊 */
    .cart-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .cart-total {
      text-align: right;
      font-size: 1.2rem;
      font-weight: 600;
      margin: 1rem 0;
      color: var(--accent);
    }

    .checkout-btn {
      width: 100%;
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .checkout-btn:hover {
      background-color: var(--accent-hover);
    }

    /* Modal 彈窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #999;
    }

    .bank-box {
      background-color: #F7F4EF;
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem 0;
      border: 1px solid var(--border-color);
    }

    .form-input {
      width: 100%;
      padding: 0.65rem;
      margin-bottom: 0.6rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>織造所 knitter in town</h1>
      <p>手作課程與材料包線上預約</p>
    </header>

    <!-- 商品列表區塊 -->
    <div class="product-grid">
      <div class="product-card">
        <div>
          <h3>珍珠奶茶造型提袋</h3>
          <p class="price">NT$ 680</p>
        </div>
        <button class="add-btn" onclick="addToCart('珍珠奶茶造型提袋', 680)">加入購物車</button>
      </div>

      <div class="product-card">
        <div>
          <h3>窗花意象束口包</h3>
          <p class="price">NT$ 850</p>
        </div>
        <button class="add-btn" onclick="addToCart('窗花意象束口包', 850)">加入購物車</button>
      </div>

      <div class="product-card">
        <div>
          <h3>基礎鉤織入門單單堂體驗</h3>
          <p class="price">NT$ 1,200</p>
        </div>
        <button class="add-btn" onclick="addToCart('基礎鉤織入門單堂體驗', 1200)">加入購物車</button>
      </div>
    </div>

    <!-- 購物車明細 -->
    <div class="cart-section">
      <h2 style="font-family: 'Noto Serif TC', serif; margin-bottom: 1rem;">已選擇品項</h2>
      <div id="cart-list">
        <p style="color: #888;">購物車目前是空的</p>
      </div>
      <div class="cart-total">
        總計：NT$ <span id="cart-total-amount">0</span>
      </div>
      <button class="checkout-btn" onclick="openBankModal()">前往結帳與對帳</button>
    </div>
  </div>

  <!-- 訂單聯絡資訊與匯款 Modal -->
  <div class="modal" id="bank-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeBankModal()">✕</button>
      <h3 style="font-family: 'Noto Serif TC', serif; color: var(--text-main); margin-bottom: 0.8rem;">填寫訂購資料</h3>
      
      <p style="font-size: 0.88rem; color: #523522; margin-bottom: 1rem;">
        請填寫您的基本資料。點擊成立訂單後，系統將自動為您複製明細並開啟官方 LINE，您可以後續完成匯款並於 LINE 回覆對帳。
      </p>

      <input type="text" id="buyer-name" class="form-input" placeholder="訂購人姓名 *">
      <input type="tel" id="buyer-phone" class="form-input" placeholder="聯絡電話 *">

      <div class="bank-box">
        <p><strong>匯款銀行：</strong> 807 永豐銀行</p>
        <p><strong>轉帳帳號：</strong> 10101800006824</p>
        <p style="margin-top: 0.4rem; border-top: 1px dashed var(--border-color); padding-top: 0.4rem; color: var(--accent); font-weight: 600;">
          應付總金額：NT$ <span id="bank-total">0</span>
        </p>
      </div>

      <button class="checkout-btn" onclick="submitOrderToLine()">成立訂單，前往 LINE 領取匯款指引</button>
    </div>
  </div>

  <script>
    let cart = [];

    // 加入購物車
    function addToCart(name, price) {
      const existingItem = cart.find(item => item.name === name);
      if (existingItem) {
        existingItem.qty += 1;
      } else {
        cart.push({ name, price, qty: 1 });
      }
      updateCartUI();
    }

    // 更新購物車畫面
    function updateCartUI() {
      const cartList = document.getElementById('cart-list');
      const totalAmountSpan = document.getElementById('cart-total-amount');

      if (cart.length === 0) {
        cartList.innerHTML = '<p style="color: #888;">購物車目前是空的</p>';
        totalAmountSpan.innerText = '0';
        return;
      }

      let html = '';
      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        html += `
          <div class="cart-item">
            <span>${item.name} x${item.qty}</span>
            <span>NT$ ${itemTotal}</span>
          </div>
        `;
      });

      cartList.innerHTML = html;
      totalAmountSpan.innerText = total;
    }

    // 開啟 Modal
    function openBankModal() {
      if (cart.length === 0) {
        alert('購物車是空的，請先選擇商品或課程！');
        return;
      }
      
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('bank-total').innerText = total;
      document.getElementById('bank-modal').classList.add('active');
    }

    // 關閉 Modal
    function closeBankModal() {
      document.getElementById('bank-modal').classList.remove('active');
    }

    // 成立訂單並導向 LINE
    function submitOrderToLine() {
      const name = document.getElementById('buyer-name').value.trim();
      const phone = document.getElementById('buyer-phone').value.trim();

      if (!name || !phone) {
        alert('請填寫姓名與聯絡電話，以便為您保留名額/商品！');
        return;
      }

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const itemList = cart.map(item => `${item.name} x${item.qty}`).join('、');
      
      // 組合傳給 LINE 的預設對話文字
      const orderText = `【織造所訂單成立通知】\n` +
                        `訂購人：${name}\n` +
                        `電 話：${phone}\n` +
                        `項 目：${itemList}\n` +
                        `總金額：NT$ ${total}\n\n` +
                        `（已收到訂單！我將於完成轉帳後在此回覆帳號末 5 碼）`;

      // 複製訊息並跳轉至 LINE
      navigator.clipboard.writeText(orderText).then(() => {
        alert('訂單已成立！資料已自動複製。\n按下「確定」將開啟官方 LINE，請直接「貼上訊息」送出即可！');
        
        // 請將此處連結替換為你的 LINE 官方帳號網址
        window.open('https://line.me/R/ti/p/@YOUR_LINE_ID', '_blank'); 

        // 清空購物車與輸入欄
        cart = [];
        document.getElementById('buyer-name').value = '';
        document.getElementById('buyer-phone').value = '';
        updateCartUI();
        closeBankModal();
      }).catch(() => {
        alert('訂單已成立！請私訊官方 LINE 告知您的姓名與訂購品項。');
        closeBankModal();
      });
    }
  </script>
</body>
</html>
